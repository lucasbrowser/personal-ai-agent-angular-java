spring:
  application:
    name: jarvis-backend
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jarvis}
    username: ${DB_USERNAME:jarvis}
    password: ${DB_PASSWORD:change-me-local}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: Jarvis Personal AI Agent
    description: Assistente pessoal inteligente por voz
    version: 0.1.0
