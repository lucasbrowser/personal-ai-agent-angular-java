spring:
  application:
    name: jarvis-backend
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jarvis}
    username: ${DB_USERNAME:jarvis}
    password: ${DB_PASSWORD:change-me-local}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

logging:
  level:
    org.springframework.web: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: Jarvis Personal AI Agent
    description: Assistente pessoal inteligente por voz
    version: 0.1.0

jarvis:
  jwt:
    secret: ${JARVIS_JWT_SECRET}
  admin:
    email: ${JARVIS_ADMIN_EMAIL:}
    password: ${JARVIS_ADMIN_PASSWORD:}
  frontend-origin: ${JARVIS_FRONTEND_ORIGIN:http://localhost:4200}
  auth:
    secure-cookie: ${JARVIS_SECURE_COOKIE:false}
  openai:
    realtime:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_REALTIME_MODEL:gpt-realtime-2.1-mini}
      voice: ${OPENAI_REALTIME_VOICE:marin}
      client-secret-ttl-seconds: ${OPENAI_REALTIME_CLIENT_SECRET_TTL_SECONDS:600}
      connect-timeout: ${OPENAI_REALTIME_CONNECT_TIMEOUT:3s}
      response-timeout: ${OPENAI_REALTIME_RESPONSE_TIMEOUT:10s}
  voice:
    sessions-per-minute: ${JARVIS_VOICE_SESSIONS_PER_MINUTE:5}
  conversation:
    context:
      max-recent-messages: ${JARVIS_CONTEXT_MAX_RECENT_MESSAGES:20}
      max-memories: ${JARVIS_CONTEXT_MAX_MEMORIES:10}
      max-characters: ${JARVIS_CONTEXT_MAX_CHARACTERS:12000}
